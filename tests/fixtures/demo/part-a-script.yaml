# Frozen copy of the WO-062 Part A pitch script (docs/demo-script.yaml before WO-062P
# replaced it with the 3:00 shot list). The Part A headless tests that assert this exact
# sequence (states, executor routing, dry-run lines) read it from here.
steps:
  - {t: "0:00", scenario: S01, expect_state: CLEARED_AT_ASK, say: "Tuesday. Filed survey, clears at ask. Zero interruptions."}
  - {t: "0:30", scenario: S02, expect_state: LOST_VEHICLE, say: "Filed glider goes silent. Lost-vehicle report with a search box to the operator."}
  - {t: "1:00", scenario: S05, say: "Harbor Night. Unfiled, closing on the fuel berth, no reply."}
  - {t: "2:00", scenario: S05, continue_run: true, approve: true, say: "Hold on one berth under standing orders. Report handed to the officer. Judge approves."}
  - {t: "2:45", scenario: live, say: "Judge drops a contact. We follow it live."}
  - {t: "3:30", scenario: twist, scenario_ref: S05, toggles: [network_down], say: "Twist: network down. Same decision on kinematics and hail alone."}
  - {t: "4:00", eval: true, say: "Catalog vs close-the-berth vs send-everything-to-a-human."}
