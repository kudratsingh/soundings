# Prior over hypotheses for an unverified contact. Stress-test numbers for the
# demonstration; labeled as such in the UI. Conditioned by zone/hour via the
# pattern-of-life table generated in Phase 1 (soundings/investigation/pol.py).
# Must sum to 1.0 (tested).

base:
  FILED_ON_PLAN: 0.45
  FILED_OFF_PLAN: 0.08
  UNFILED_KNOWN_OPERATOR: 0.07
  BIOLOGIC: 0.20
  DEBRIS_OR_DRIFT: 0.10
  SURFACE_VESSEL_AIS_OFF: 0.05
  UNAUTHORIZED_UUV: 0.03
  UNAUTHORIZED_DIVER: 0.02

# multiplicative adjustments by context, renormalized after applying
adjustments:
  night_hours: {hours: [22, 23, 0, 1, 2, 3, 4, 5], FILED_ON_PLAN: 0.4, BIOLOGIC: 1.2, UNAUTHORIZED_UUV: 1.5, UNAUTHORIZED_DIVER: 1.5}
  critical_zone: {zone_criticality_min: 0.7, UNAUTHORIZED_UUV: 1.3, DEBRIS_OR_DRIFT: 0.8}
