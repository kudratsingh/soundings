# Registry of planned underwater work (WO-020). Read by soundings.registry.models.
# Fixed UTC offsets avoid needing a tz database; the sim day is the demo Saturday.
registry:
  modem_id_pattern: "^MOD-[0-9]{4,6}$"   # S02 files MOD-4471; WO-021's hail config must agree
  sim_epoch_date: "2026-10-17"            # tick 0 is this date at the scenario's hour_of_day
  sim_epoch_utc_offset: "-07:00"          # Pacific daylight time on the demo weekend
  retention_days: 30                      # CLAUDE.md section 6: no retention beyond 30 days
  plan_id_prefix: "P"                     # auto-assigned ids look like P-20261017-001

# WO-081: conflict detection at filing. Read by soundings.registry.models.load_conflict_config.
# A conflict needs overlap in all three of area (buffered zone polygons), depth band and
# time window. The depth bands are STRESS-TEST ASSUMPTIONS per job type, not survey data
# (DECISIONS 2026-10-17 06:37); they apply only when a plan gives no depth band.
conflicts:
  area_buffer_m: 50          # every zone widened by 50 m before the area test
  depth_defaults_m:          # [min, max] metres below the surface (stress-test values)
    survey: [0, 30]
    hull_cleaning: [0, 12]
    pile_inspection: [0, 20]
    dredge: [5, 25]
    other: [0, 30]

# WO-082: slot proposals. Read by soundings.registry.slots.load_slot_config. A proposal
# shifts start times (never routes, never vehicles) and changes nothing until an operator
# accepts it in the registry form. Capacities are demo values, not port rules.
slots:
  zone_capacity_default: 2      # concurrent plans a zone takes (owner directive default)
  zone_capacity: {}             # per-zone overrides, e.g. {fuel_berths: 1}
  slot_step_min: 15             # start times move on a 15-minute grid
  latest_start_slack_min: 120   # latest start when a plan gives none: filed start + 2 h
  horizon_end_local: "24:00"    # every proposed slot ends on the plan's local day
  random_seed: 7                # CP-SAT seed (single worker; CLAUDE.md 2.4)
  max_time_in_seconds: 2.0      # wall and deterministic-time limit per solve
