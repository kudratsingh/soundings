# Static current field by tide phase (docs/SPEC-SIM.md section 2), simplified for
# demonstration: a coarse lat/lon grid of cell centres with one (u, v) vector per
# cell, u east and v north in m/s. Lookup is nearest cell, no interpolation
# (soundings.sim.current.CurrentField.vector_at). Magnitudes stay in 0.05-0.3 m/s so
# drift is measurable against position noise. Flood sets into the harbor (north),
# ebb sets out, slack is weak and variable. Rows run south to north (lats), columns
# west to east (lons). No live gauge: every value is a stated assumption.

